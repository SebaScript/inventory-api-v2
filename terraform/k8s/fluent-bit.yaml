# Rendered by Terraform (ec2.tf): one log shipper per node, reading the API pods' logs into CloudWatch.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit
  namespace: inventory
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     warn
        Parsers_File  /fluent-bit/etc/parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/inventory-api-*_inventory_api-*.log
        Parser            cri
        Tag               api.*
        Refresh_Interval  5
        Mem_Buf_Limit     10MB

    # Only the app's own line goes out: it is JSON, so Logs Insights reads its fields.
    [OUTPUT]
        Name               cloudwatch_logs
        Match              api.*
        region             ${region}
        log_group_name     ${log_group}
        log_stream_prefix  pod-
        log_key            message
        auto_create_group  false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: inventory
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.2.0
          command: [/fluent-bit/bin/fluent-bit, -c, /fluent-bit/etc/fluent-bit.conf]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: fluent-bit
