# Wires Grafana to Prometheus automatically, so there is no clicking through
# the "add a data source" wizard.
#
# The url is `http://prometheus:9090`, the service name from docker-compose.
# `localhost` does NOT work here: inside the Grafana container that means
# Grafana itself.
#
# The uid is pinned because the provisioned dashboard refers to it by name.
# Without it Grafana invents a random one and every panel loads empty.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
