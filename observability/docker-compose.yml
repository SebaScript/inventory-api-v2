# Local Prometheus + Grafana, for looking only (`docker compose up -d`).
#   Grafana     http://localhost:3001  (admin / admin; 3000 is the API)
#   Prometheus  http://localhost:9090  (check /targets first)
# Data source and dashboard are provisioned from files: nothing to click.

services:
  prometheus:
    image: prom/prometheus
    container_name: inventory-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: inventory-grafana
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/inventory/inventory.json
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./dashboards:/etc/grafana/provisioning/dashboards/inventory:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
