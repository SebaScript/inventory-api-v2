# Local Prometheus, for looking only. Copy to prometheus.yml (git-ignored).
# Scrapes through the orchestrator, which holds the API key. Plain http: it has no TLS.

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: inventory-api
    metrics_path: /metrics/inventory
    scheme: http
    static_configs:
      - targets: ['ORCHESTRATOR_HOST']
        labels:
          api: inventory
          cloud: aws

# No remote_write: the in-cluster Prometheus feeds Grafana Cloud; two would double every rate.
