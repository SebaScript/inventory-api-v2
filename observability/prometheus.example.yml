# Prometheus for the inventory API.
#
# Copy to prometheus.yml and fill in the three placeholders. prometheus.yml is
# ignored by git: it names the orchestrator's address and this API's Grafana
# Cloud instance, neither of which belongs in a public repository.
#
# It scrapes THROUGH the orchestrator, not the API directly. The API sits behind
# API Gateway and requires an API key on every call; Prometheus has no clean way
# to send one, and handing our key to another team's tooling is worse. The
# orchestrator holds the key and exposes one clean path per API.
#
# The orchestrator answers on a bare IP with no certificate, so the scheme is
# `http`. Anything sent to it, the orchestrator's own key included, travels in
# clear text. Acceptable for a demo, not for anything else.

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: inventory-api
    metrics_path: /metrics/inventory
    scheme: http
    static_configs:
      - targets: ['ORCHESTRATOR_HOST']
        labels:
          api: inventory
          cloud: aws

# Ship every sample to this API's own Grafana Cloud stack as well.
#
# Grafana Cloud cannot scrape the orchestrator itself: its agentless
# "Metrics Endpoint" only accepts HTTPS urls with Basic or Bearer auth, and the
# orchestrator serves plain HTTP with none. So this Prometheus scrapes it and
# pushes the samples on.
#
# The token lives in `observability/grafana-cloud-token`, which is git-ignored.
# This file is committed, so it must never hold the token itself.
remote_write:
  - url: https://YOUR-GRAFANA-CLOUD-PROMETHEUS/api/prom/push
    basic_auth:
      username: 'YOUR_INSTANCE_ID'
      password_file: /etc/prometheus/grafana-cloud-token
