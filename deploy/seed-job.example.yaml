# Copy to seed-job.yaml (git-ignored), set the image. Run once, BEFORE the Deployment:
# it creates the schema and the demo data, so the replicas never race to do it.
apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-seed
  namespace: inventory
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: inventory-api
      containers:
        - name: seed
          image: REPLACE_WITH_YOUR_ECR_REPOSITORY:latest
          command: ['node', 'dist/database/seed.cli.js']
          envFrom:
            - configMapRef:
                name: inventory-api
            - secretRef:
                name: inventory-api
          env:
            - name: DB_SYNC
              value: 'true'
