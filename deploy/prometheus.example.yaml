# Prometheus, inside the cluster, shipping this API's metrics to its own
# Grafana Cloud stack.
#
# Copy to prometheus.yaml, fill in the three placeholders and apply that copy.
# prometheus.yaml is ignored by git: it names the orchestrator's address and
# this API's Grafana Cloud instance.
#
#   kubectl create secret generic grafana-cloud-prometheus -n inventory \
#     --from-file=token=observability/grafana-cloud-token
#   kubectl apply -f deploy/prometheus.yaml
#
# Why it lives here and not on a laptop: Grafana Cloud cannot scrape the
# orchestrator itself (its agentless scraper wants HTTPS with credentials, and
# the orchestrator serves plain HTTP with none), so something has to scrape and
# forward. On a laptop, closing the lid stops the metrics. Here it runs next to
# the API, all the time.
#
# Agent mode: Prometheus only scrapes and forwards. No local database to query,
# no volume to keep, a fraction of the memory. Everything is read in Grafana
# Cloud, so a local copy would be dead weight.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: inventory
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      # Stamped on every series this instance sends, so Grafana Cloud can tell
      # it apart from any other Prometheus writing the same metrics.
      external_labels:
        collector: eks

    scrape_configs:
      # The metrics themselves: every API pod, found through the Kubernetes API
      # and read directly. Going through the load balancer instead lands each
      # scrape on whichever pod answers, the counters of different pods get
      # mixed into one series, and rate() reads every jump back as a reset:
      # after a load test it showed 271 requests a second with no traffic at
      # all. One series per pod has none of that, and follows the autoscaler.
      - job_name: inventory-api-pods
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [inventory]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: inventory-api
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: api
            replacement: inventory
          - target_label: cloud
            replacement: aws

      # The path the other cloud reads, kept only as a health check: `up` says
      # whether the orchestrator is serving these metrics. Every sample it
      # returns is dropped, or each request would be counted twice.
      - job_name: inventory-api
        metrics_path: /metrics/inventory
        scheme: http
        static_configs:
          - targets: ['ORCHESTRATOR_HOST']
            labels:
              api: inventory
              cloud: aws
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: .+
            action: drop

    remote_write:
      - url: https://YOUR-GRAFANA-CLOUD-PROMETHEUS/api/prom/push
        basic_auth:
          username: 'YOUR_NUMERIC_INSTANCE_ID'
          password_file: /etc/grafana-cloud/token
---
# Pod discovery reads the Kubernetes API: list and watch pods in this
# namespace, nothing else and nowhere else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: inventory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: inventory
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: inventory
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: inventory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: inventory
spec:
  # One on purpose: two would scrape the same target and send every sample
  # twice, which Grafana Cloud rejects as duplicates.
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        # A node consolidation would leave a gap in every graph. Same reason
        # as the API's own deployment.
        karpenter.sh/do-not-disrupt: 'true'
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          # Pinned: the version already proven against this Grafana Cloud stack.
          image: prom/prometheus:v3.14.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --agent
            - --storage.agent.path=/prometheus
            - --web.listen-address=:9090
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: grafana-cloud
              mountPath: /etc/grafana-cloud
              readOnly: true
            # The agent's write-ahead log: samples wait here if Grafana Cloud
            # is briefly unreachable. Losing it on a restart only loses what
            # had not been sent yet.
            - name: wal
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: grafana-cloud
          secret:
            secretName: grafana-cloud-prometheus
        - name: wal
          emptyDir: {}
---
# Only for `kubectl port-forward`, to look at the scrape status. Not exposed
# outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: inventory
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
