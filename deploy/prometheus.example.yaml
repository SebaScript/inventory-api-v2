# Prometheus in agent mode: scrapes each API pod and forwards to Grafana Cloud.
# Keeps no data itself. Copy to prometheus.yaml (git-ignored), fill in, then:
#   kubectl create secret generic grafana-cloud-prometheus -n inventory \
#     --from-file=token=observability/grafana-cloud-token
#   kubectl apply -f deploy/prometheus.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: inventory
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      external_labels:
        collector: eks

    scrape_configs:
      # Every API pod, read directly. Through the load balancer, the pods'
      # counters mixed into one series and rates came out wrong.
      - job_name: inventory-api-pods
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [inventory]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: inventory-api
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '3000'
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: api
            replacement: inventory
          - target_label: cloud
            replacement: aws

      # The orchestrator path, as a health check only: samples are dropped.
      - job_name: inventory-api
        metrics_path: /metrics/inventory
        scheme: http
        static_configs:
          - targets: ['ORCHESTRATOR_HOST']
            labels:
              api: inventory
              cloud: aws
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: .+
            action: drop

    remote_write:
      - url: https://YOUR-GRAFANA-CLOUD-PROMETHEUS/api/prom/push
        basic_auth:
          username: 'YOUR_NUMERIC_INSTANCE_ID'
          password_file: /etc/grafana-cloud/token
---
# Pod discovery: list pods in this namespace, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: inventory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: inventory
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: inventory
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: inventory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: inventory
spec:
  # One: two would send every sample twice.
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        karpenter.sh/do-not-disrupt: 'true'
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --agent
            - --storage.agent.path=/prometheus
            - --web.listen-address=:9090
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: grafana-cloud
              mountPath: /etc/grafana-cloud
              readOnly: true
            # Buffers samples while Grafana Cloud is unreachable.
            - name: wal
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: grafana-cloud
          secret:
            secretName: grafana-cloud-prometheus
        - name: wal
          emptyDir: {}
---
# For `kubectl port-forward` only: see /targets.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: inventory
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
