# OpenTelemetry auto-instrumentation: the add-on's operator injects the SDK into
# the API pods (init container + NODE_OPTIONS). No code changes in the app.
# Without this resource, nothing is injected.
apiVersion: cloudwatch.aws.amazon.com/v1alpha1
kind: Instrumentation
metadata:
  name: inventory-api
  namespace: inventory
spec:
  # tracecontext: the W3C standard the other cloud speaks. xray: joins API Gateway.
  propagators:
    - tracecontext
    - baggage
    - xray
  # X-Ray sampling rules decide, so /health* and /metrics* can be dropped by path.
  sampler:
    type: xray
    argument: endpoint=http://cloudwatch-agent.amazon-cloudwatch:2000
  nodejs:
    env:
      - name: OTEL_AWS_APPLICATION_SIGNALS_ENABLED
        value: 'true'
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - name: OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT
        value: http://cloudwatch-agent.amazon-cloudwatch:4316/v1/metrics
      # Traces go to the collector, which sends them to X-Ray and Grafana Cloud.
      - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: http://otel-collector.inventory:4318/v1/traces
      - name: OTEL_TRACES_SAMPLER
        value: xray
      - name: OTEL_TRACES_SAMPLER_ARG
        value: endpoint=http://cloudwatch-agent.amazon-cloudwatch:2000
