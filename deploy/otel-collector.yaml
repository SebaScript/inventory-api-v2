# OpenTelemetry Collector: the SDK exports to one place, this sends every trace
# to two, X-Ray (AWS) and Tempo (Grafana Cloud).
#
# Needs a secret with the whole Authorization header, never committed:
#   kubectl create secret generic grafana-cloud-otlp -n inventory \
#     --from-literal=authorization="Basic $(printf '%s' "STACK_ID:TOKEN" | base64 -w0)"
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: inventory
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # Drops data before the pod runs out of memory.
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch: {}

    exporters:
      otlphttp/cloudwatch:
        traces_endpoint: http://cloudwatch-agent.amazon-cloudwatch:4316/v1/traces
      otlphttp/grafana:
        endpoint: https://otlp-gateway-prod-us-east-3.grafana.net/otlp
        headers:
          Authorization: ${env:GRAFANA_CLOUD_AUTHORIZATION}

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          # Each exporter retries on its own: one failing does not block the other.
          exporters: [otlphttp/cloudwatch, otlphttp/grafana]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: collector
          # Pinned: config keys change between releases.
          image: otel/opentelemetry-collector-contrib:0.161.0
          args: ['--config=/conf/config.yaml']
          ports:
            - containerPort: 4318
          env:
            - name: GRAFANA_CLOUD_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-otlp
                  key: authorization
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: inventory
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
