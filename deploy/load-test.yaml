# A 4-minute load burst to watch the autoscaler:
#   kubectl apply -f deploy/load-test.yaml
#   kubectl get hpa -n inventory -w
# From inside the cluster: through the gateway, the rate limit caps it at 10 req/s.
apiVersion: batch/v1
kind: Job
metadata:
  name: load-test
  namespace: inventory
spec:
  backoffLimit: 0
  # Deleted a minute after finishing, so it can be run again.
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app: load-test
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              for i in $(seq 1 24); do
                (while true; do
                  wget -q -O /dev/null "http://inventory-api.inventory/v2/items?limit=50"
                done) &
              done
              sleep 240
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              memory: 64Mi
