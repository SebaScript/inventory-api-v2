# Copy to config.yaml (git-ignored: it holds credentials), fill in, apply.
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-api
  namespace: inventory
data:
  NODE_ENV: production
  PORT: '3000'
  # RDS requires TLS.
  DB_SSL: 'true'
  # The seed Job builds the schema; replicas doing it at once would race.
  DB_SYNC: 'false'
  AWS_REGION: us-east-1
  S3_BUCKET: REPLACE_WITH_YOUR_BUCKET
  # Empty: no cross-cloud lookups, `partner` reports `disabled`.
  ORCHESTRATOR_URL: ''
  PARTNER_KEY: ''
  INTEROP_TIMEOUT_MS: '1500'
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-api
  namespace: inventory
type: Opaque
stringData:
  # No `sslmode` here: it would override DB_SSL.
  DATABASE_URL: postgres://USER:PASSWORD@YOUR-DB-ENDPOINT:5432/inventory
  # Empty: no cache, every read goes to the database.
  REDIS_URL: redis://YOUR-CACHE-ENDPOINT:6379
  ORCHESTRATOR_API_KEY: ''
