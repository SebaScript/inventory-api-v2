# Copy to deployment.yaml (git-ignored), set the image, apply the copy.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
      annotations:
        # OpenTelemetry injection (see instrumentation.yaml).
        instrumentation.opentelemetry.io/inject-nodejs: 'true'
        # Stops Auto Mode moving these pods just to save money: it used to evict
        # both replicas at once and leave the gateway with nothing to call.
        karpenter.sh/do-not-disrupt: 'true'
    spec:
      serviceAccountName: inventory-api
      # Room for the 5 s drain in HealthController.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: REPLACE_WITH_YOUR_ECR_REPOSITORY:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: inventory-api
            - secretRef:
                name: inventory-api
          # Up to 90 s to start before liveness takes over.
          startupProbe:
            httpGet: { path: /health/live, port: 3000 }
            periodSeconds: 2
            failureThreshold: 45
          # Never touches the database: a database blip must not restart every pod.
          livenessProbe:
            httpGet: { path: /health/live, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          # Checks the database: a failing pod leaves the load balancer, no restart.
          readinessProbe:
            httpGet: { path: /health/ready, port: 3000 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # No CPU limit on purpose: it throttles instead of protecting.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          # The only writable path, since the filesystem is read only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
