# Autoscaling on CPU, 2 to 6 replicas. Needs metrics-server (Auto Mode lacks it):
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
# CPU, not memory: Node's memory barely moves with load.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-api
  namespace: inventory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory-api
  # Never below 2: one replica would undo the redundancy.
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 50 % of the 100m request.
          averageUtilization: 50
  behavior:
    # Up at once, down after 5 stable minutes, so it does not flap.
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300
