# Production pipeline — guards the `main` branch.
#
#   install -> lint -> build -> tests -> coverage >= 85% -> deploy Production
#
# Each step runs in order and the job stops at the first failure, so a red test
# or a missed coverage bar makes the deploy step unreachable.
name: Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    # Publishing the image to GHCR needs write access to packages, which the
    # default GITHUB_TOKEN does not have. Everything else stays read-only.
    permissions:
      contents: read
      packages: write

    services:
      # Real PostgreSQL: the tests assert on transactions, row locks and CHECK
      # constraints, none of which can be faked.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_prod_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10

    env:
      DATABASE_URL: postgres://inventory:inventory@localhost:5432/inventory_prod_ci
      # Production's quality bar.
      COVERAGE_MIN: 85

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Quality gate 1 - the rubric allows zero failing tests. Jest exits
      # non-zero if a single test fails, and also if it finds no tests at all,
      # so the gate cannot be passed by deleting the suite.
      - name: Quality gate 1 - automated tests (0 failures allowed)
        run: npm test

      # Quality gate 2 - the coverage bar for this environment. COVERAGE_MIN
      # feeds Jest's coverageThreshold, and missing it exits non-zero as well.
      - name: Quality gate 2 - coverage (>= 85%)
        run: npm run test:cov

      - name: Build the Docker image
        run: docker build -t inventory-api:prod .

      - name: Deploy to Production
        run: |
          echo "Publishing image for the Production environment"
          docker tag inventory-api:prod ghcr.io/${GITHUB_REPOSITORY,,}:prod
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:prod
