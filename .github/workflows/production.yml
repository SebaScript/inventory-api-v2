name: Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_prod_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10

    env:
      DATABASE_URL: postgres://inventory:inventory@localhost:5432/inventory_prod_ci
      COVERAGE_MIN: 85

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Quality gate 1 - tests (0 failures allowed)
        run: npm test

      - name: Quality gate 2 - coverage >= 85%
        run: npm run test:cov

      - name: Build the Docker image
        run: docker build -t inventory-api:prod .

      - name: Publish the image to GHCR
        run: |
          docker tag inventory-api:prod ghcr.io/${GITHUB_REPOSITORY,,}:prod
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:prod

  deploy:
    needs: pipeline
    if: github.event_name != 'pull_request'
    runs-on: self-hosted

    environment:
      name: production
      url: http://localhost:3200

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Write the environment configuration
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ENV_FILE)) {
            Write-Output "::error::The production environment has no ENV_FILE secret configured."
            exit 1
          }
          # LF endings and no byte-order mark, or Compose reads stray characters
          # into the values.
          $text = $env:ENV_FILE -replace "`r`n", "`n"
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$PWD\.env.production", $text, $utf8)

      - name: Pull the published image and restart the stack
        run: |
          docker compose --env-file .env.production pull api
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker compose --env-file .env.production up -d --no-build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify the environment is serving the new image
        run: |
          $healthy = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-RestMethod http://localhost:3200/health -TimeoutSec 5
              if ($r.status -eq 'ok') { $healthy = $true; break }
            } catch { }
            Start-Sleep -Seconds 2
          }
          if (-not $healthy) {
            Write-Output "::error::The Production API never became healthy after the restart. Container log follows."
            docker compose --env-file .env.production logs api --tail 40
            exit 1
          }
          Write-Output "health: ok"

          # The running container must be the image that was just pulled, not a
          # leftover from an earlier deployment.
          $expected = @(docker image inspect --format '{{.Id}}' ghcr.io/sebascript/inventory-api-v2:prod)[0]
          $cid = @(docker compose --env-file .env.production ps -q api)[0]
          $running = @(docker inspect --format '{{.Image}}' $cid)[0]
          Write-Output "expected: $expected"
          Write-Output "running:  $running"
          if ($expected -ne $running) {
            Write-Output "::error::The running container is not the image that was just published."
            exit 1
          }
          exit 0

      - name: Remove the environment file from the workspace
        if: always()
        run: |
          if (Test-Path .env.production) { Remove-Item .env.production -Force }
