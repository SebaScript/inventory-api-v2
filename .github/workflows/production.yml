name: Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Build and verify. Produces the artifact; deploys nothing.
  pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_prod_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10

    env:
      DATABASE_URL: postgres://inventory:inventory@localhost:5432/inventory_prod_ci
      COVERAGE_MIN: 85

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Quality gate 1 - tests (0 failures allowed)
        run: npm test

      - name: Quality gate 2 - coverage >= 85%
        run: npm run test:cov

      - name: Build the Docker image
        run: docker build --build-arg GIT_SHA=${GITHUB_SHA} -t inventory-api:prod .

      # Two tags for one image: `prod` is what a human pulls, the commit sha is
      # the immutable reference the deployment pins itself to.
      - name: Publish the image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag inventory-api:prod ghcr.io/${GITHUB_REPOSITORY,,}:prod
          docker tag inventory-api:prod ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:prod
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}

  # The deployment itself: this is what updates the API that is running.
  #
  # Render hosts the environment, so deploying is an API call rather than a
  # shell on a server: tell Render which image to run, wait for the rollout,
  # then ask the live service which commit it is serving. Nothing is built here.
  #
  # `needs: pipeline` is what makes the quality gates binding: if either gate
  # fails, the job above fails and this one never starts.
  deploy:
    needs: pipeline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}

    steps:
      - name: Ask Render to run the image this pipeline just published
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "deploying $image"

          # Pinned to the commit rather than to a moving tag, so the deployment
          # is reproducible and can be rolled back to a known build.
          response=$(curl -fsS -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"imageUrl\":\"${image}\"}")

          id=$(echo "$response" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            echo "::error::Render did not return a deploy id. Response: $response"
            exit 1
          fi
          echo "deploy_id=$id" >> "$GITHUB_OUTPUT"

      - name: Wait for the rollout to finish
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            status=$(curl -fsS \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.status')
            echo "status: $status"

            case "$status" in
              live) exit 0 ;;
              build_failed | update_failed | pre_deploy_failed | canceled | deactivated)
                echo "::error::Render reported the deployment as $status."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::The deployment did not become live within 10 minutes."
          exit 1

      # Proof rather than assumption: the running service must report the very
      # commit this pipeline built.
      - name: Verify the live service is serving this revision
        env:
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            # A free Render service sleeps when idle, so the first request may
            # have to wake it before it answers.
            body=$(curl -fsS --max-time 30 "${SERVICE_URL}/health" || true)
            revision=$(echo "$body" | jq -r '.revision // empty')

            if [ "$revision" = "${GITHUB_SHA}" ]; then
              echo "health: $body"
              exit 0
            fi
            echo "serving revision ${revision:-none}, waiting for ${GITHUB_SHA}"
            sleep 10
          done
          echo "::error::The service never reported revision ${GITHUB_SHA}."
          exit 1
