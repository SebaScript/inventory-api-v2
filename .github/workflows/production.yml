name: Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Build and verify. Produces the artifact; deploys nothing.
  pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_prod_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10

    env:
      DATABASE_URL: postgres://inventory:inventory@localhost:5432/inventory_prod_ci
      COVERAGE_MIN: 85

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Quality gate 1 - tests (0 failures allowed)
        run: npm test

      - name: Quality gate 2 - coverage >= 85%
        run: npm run test:cov

      - name: Build the Docker image
        run: docker build -t inventory-api:prod .

      - name: Publish the image to GHCR
        run: |
          docker tag inventory-api:prod ghcr.io/${GITHUB_REPOSITORY,,}:prod
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:prod

  # The deployment itself: this is what updates the API that is running.
  #
  # It runs on a self-hosted runner because that machine is the Production
  # host. GitHub cannot reach into it, so the runner reaches out, pulls the
  # image the job above published, and restarts the stack with it. Nothing is
  # ever built here — the server runs the exact artifact that passed the gates.
  #
  # `needs: pipeline` is what makes the gates binding: if either gate fails,
  # the job above fails and this one never starts.
  deploy:
    needs: pipeline
    if: github.event_name == 'push'
    runs-on: self-hosted

    # The environment holds its own secrets, and GitHub records a deployment
    # against it on every run.
    environment:
      name: production
      url: http://localhost:3200

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Write the environment configuration
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          echo "$ENV_FILE" > .env.production
          if [ ! -s .env.production ]; then
            echo "::error::The production environment has no ENV_FILE secret configured."
            exit 1
          fi

      - name: Pull the published image and restart the stack
        run: |
          docker compose --env-file .env.production pull api
          docker compose --env-file .env.production up -d --no-build

      - name: Verify the environment is serving the new image
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3200/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fs http://localhost:3200/health
          echo

          # The running container must be the image that was just pulled, not a
          # leftover from an earlier deployment.
          expected=$(docker image inspect --format '{{.Id}}' ghcr.io/${GITHUB_REPOSITORY,,}:prod)
          running=$(docker inspect --format '{{.Image}}' "$(docker compose --env-file .env.production ps -q api)")
          echo "expected: $expected"
          echo "running:  $running"
          test "$expected" = "$running"

      - name: Remove the environment file from the workspace
        if: always()
        run: rm -f .env.production
