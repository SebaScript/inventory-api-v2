name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: apply deploys the infrastructure and the API; destroy removes everything
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  contents: read

concurrency: infrastructure

defaults:
  run:
    working-directory: terraform

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Init, with the state in S3
        run: |
          BUCKET="inventory-api-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || aws s3 mb "s3://$BUCKET"
          terraform init -backend-config="bucket=$BUCKET"

      - name: Validate
        run: terraform fmt -check && terraform validate

      - name: Destroy everything
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Create the image registry
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -target=aws_ecr_repository.api

      - uses: aws-actions/amazon-ecr-login@v2
        if: inputs.action == 'apply'

      - name: Build and push the API image
        if: inputs.action == 'apply'
        run: |
          IMAGE="$(terraform output -raw ecr_repository_url):$GITHUB_SHA"
          docker build -t "$IMAGE" ..
          docker push "$IMAGE"

      - name: Deploy the infrastructure and the API
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -var="image_tag=$GITHUB_SHA"

      - name: Smoke test (the machine needs a few minutes to boot and start the API)
        if: inputs.action == 'apply'
        run: |
          URL=$(terraform output -raw api_url)
          curl --fail --silent --show-error --connect-timeout 5 --retry 40 --retry-delay 10 --retry-all-errors "$URL/health/ready"
          echo "API: $URL/docs" >> "$GITHUB_STEP_SUMMARY"
