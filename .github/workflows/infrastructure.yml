name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: apply deploys the infrastructure and the API; destroy removes everything
        type: choice
        options: [apply, destroy]
        default: apply
      chaos_gate:
        description: apply only. Run chaos experiment (a) after deploying; the pipeline fails if the flow loses its p95
        type: boolean
        default: true

permissions:
  contents: read

concurrency: infrastructure

defaults:
  run:
    working-directory: terraform

# The partner and the traces. Empty secrets switch them off; they never reach the logs.
env:
  TF_VAR_partner_url: ${{ secrets.PARTNER_URL }}
  TF_VAR_partner_api_key: ${{ secrets.PARTNER_API_KEY }}
  TF_VAR_otlp_endpoint: ${{ secrets.OTLP_ENDPOINT }}
  TF_VAR_otlp_headers: ${{ secrets.OTLP_HEADERS }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Init, with the state in S3
        run: |
          BUCKET="inventory-api-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || aws s3 mb "s3://$BUCKET"
          terraform init -backend-config="bucket=$BUCKET"

      - name: Validate
        run: terraform fmt -check && terraform validate

      - name: Destroy everything
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Create the image registry
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -target=aws_ecr_repository.api

      - uses: aws-actions/amazon-ecr-login@v2
        if: inputs.action == 'apply'

      - name: Build and push the API image (tags are immutable, so an existing one is kept)
        if: inputs.action == 'apply'
        run: |
          IMAGE="$(terraform output -raw ecr_repository_url):$GITHUB_SHA"
          if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            docker build -t "$IMAGE" ..
            docker push "$IMAGE"
          fi

      - name: Deploy the infrastructure, with this commit's image on the cluster
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -var="image_tag=$GITHUB_SHA"

      - name: Smoke test (the node needs a few minutes to start k3s and both replicas)
        if: inputs.action == 'apply'
        run: |
          URL=$(terraform output -raw api_url)
          curl --fail --silent --show-error --connect-timeout 5 --retry 60 --retry-delay 10 \
            --retry-all-errors -D - -o /dev/null "$URL/health/ready" | grep -i "x-app-version"
          {
            echo "API: $URL/docs"
            echo "Dashboard: $(terraform output -raw dashboard_url)"
          } >> "$GITHUB_STEP_SUMMARY"

  chaos-gate:
    needs: terraform
    if: inputs.action == 'apply' && inputs.chaos_gate
    uses: ./.github/workflows/chaos.yml
    with:
      experiment: a-partner-latency
      round: gate
    secrets: inherit
