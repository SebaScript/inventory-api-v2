name: Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: infrastructure

defaults:
  run:
    working-directory: terraform

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Init, with the state in S3
        run: |
          BUCKET="inventory-api-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || aws s3 mb "s3://$BUCKET"
          terraform init -backend-config="bucket=$BUCKET"

      - name: Validate
        run: terraform fmt -check && terraform validate


      - name: Create the image registry
        run: terraform apply -auto-approve -target=aws_ecr_repository.api

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the API image
        run: |
          IMAGE="$(terraform output -raw ecr_repository_url):$GITHUB_SHA"
          docker build -t "$IMAGE" ..
          docker push "$IMAGE"

      - name: Deploy the infrastructure and the API
        run: terraform apply -auto-approve -var="image_tag=$GITHUB_SHA"

      - name: Seed the database (one-off task, skipped if there is data)
        run: |
          CLUSTER=$(terraform output -raw cluster)
          SERVICE=$(terraform output -raw service)
          NETWORK=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].networkConfiguration' --output json)
          TASK=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$SERVICE" \
            --launch-type FARGATE --network-configuration "$NETWORK" \
            --overrides '{"containerOverrides":[{"name":"api","command":["node","dist/database/seed.cli.js"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK"
          test "$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
            --query 'tasks[0].containers[0].exitCode' --output text)" = 0

      - name: Smoke test
        run: |
          URL=$(terraform output -raw api_url)
          curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors "$URL/health/ready"
          echo "API: $URL/docs" >> "$GITHUB_STEP_SUMMARY"
