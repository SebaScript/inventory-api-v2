# ---------------------------------------------------------------------------
# Production Pipeline — the gate that guards `main`.
#
#   Checkout -> Install -> Lint -> Type check -> Build
#            -> Run tests -> Coverage >= 85%
#            -> Production Docker stack smoke test -> Deploy Production
#
# Identical in structure to the Test Pipeline, with a higher bar: 85% coverage
# instead of 60%, and the production compose stack instead of the test one.
#
# Every stage is a job chained with `needs`, so a failure anywhere structurally
# prevents the deployment from running. No `|| true`, no `continue-on-error`, no
# swallowed exit codes.
# ---------------------------------------------------------------------------
name: Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two production deployments overlap. Unlike the test pipeline, an
  # in-flight run is allowed to finish rather than being cancelled.
  group: production-pipeline
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  # Production's quality bar.
  COVERAGE_MIN: '85'

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  quality:
    name: Lint, type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f dist/main.js && test -f dist/database/data-source.js

      - name: Audit production dependencies
        # Production-only: a vulnerability in a build tool does not ship, but
        # one in a runtime dependency does.
        run: npm audit --omit=dev --audit-level=high

  # -------------------------------------------------------------------------
  test:
    name: Tests and coverage gate (>= 85%)
    needs: quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inventory_ci
          POSTGRES_PASSWORD: inventory_ci
          POSTGRES_DB: inventory_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inventory_ci -d inventory_ci -q"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://inventory_ci:inventory_ci@localhost:5432/inventory_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit, integration and E2E tests with coverage
        # Jest exits non-zero below the threshold, so this step is both the test
        # run and the coverage gate. Zero failing tests is enforced by the same
        # command.
        run: npm run test:ci
        env:
          COVERAGE_MIN: ${{ env.COVERAGE_MIN }}

      - name: Report coverage
        if: always()
        run: |
          node -e "
            const s = require('./coverage/coverage-summary.json').total;
            const min = Number(process.env.COVERAGE_MIN);
            const rows = ['| Metric | Covered | Threshold | Status |', '|---|---|---|---|'];
            for (const key of ['lines', 'statements', 'functions', 'branches']) {
              const pct = s[key].pct;
              rows.push('| ' + key + ' | ' + pct + '% | ' + min + '% | ' + (pct >= min ? 'PASS' : 'FAIL') + ' |');
            }
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Coverage (Production)\n\n' + rows.join('\n') + '\n');
          "
        env:
          COVERAGE_MIN: ${{ env.COVERAGE_MIN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-production
          path: coverage/
          retention-days: 30

  # -------------------------------------------------------------------------
  docker:
    name: Production stack smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the Production environment file
        run: |
          cat > .env.production <<EOF
          NODE_ENV=production
          PORT=3000
          POSTGRES_USER=inventory_prod
          POSTGRES_PASSWORD=${{ secrets.PRODUCTION_DB_PASSWORD || 'ci_ephemeral_password' }}
          POSTGRES_DB=inventory_prod
          API_PORT=3200
          DB_SSL=false
          DB_LOGGING=false
          DB_POOL_SIZE=20
          RUN_MIGRATIONS_ON_START=true
          SEED_ON_START=false
          SWAGGER_ENABLED=true
          CORS_ORIGIN=*
          LOG_LEVEL=warn
          EOF

      - name: Build and start the Production stack
        run: npm run docker:prod -- --wait --wait-timeout 180

      - name: Verify the production stack is healthy and empty
        # Production must NOT seed itself. Confirming the inventory starts empty
        # is how we know demo data cannot reach a real deployment.
        run: |
          curl -fsS http://localhost:3200/health | tee /dev/stderr | grep -q '"status":"ok"'
          total=$(curl -fsS http://localhost:3200/items/summary | node -e "
            let raw=''; process.stdin.on('data', c => raw += c);
            process.stdin.on('end', () => process.stdout.write(String(JSON.parse(raw).totalItems)));
          ")
          echo "Items present in production stack: $total"
          test "$total" = "0" || { echo "Production stack was seeded with demo data"; exit 1; }

      - name: Smoke test the running API
        # Same script as the Test pipeline, so both environments are proven
        # against an identical contract. EXPECT_SEED_DATA stays unset here:
        # production starts empty by design, which the previous step asserts.
        run: bash scripts/smoke-test.sh http://localhost:3200

      - name: Verify stack traces are not exposed
        # A production build must never leak internals in an error response.
        run: |
          body=$(curl -sS http://localhost:3200/groups/999999)
          echo "$body"
          echo "$body" | grep -q '"statusCode":404' || { echo "Unexpected error shape"; exit 1; }
          if echo "$body" | grep -q '"stack"'; then
            echo "Production response leaked a stack trace"
            exit 1
          fi

      - name: Dump container logs on failure
        if: failure()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color

      - name: Tear down
        if: always()
        run: npm run docker:prod:down

  # -------------------------------------------------------------------------
  deploy-production:
    name: Deploy Production
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute the image name
        # Docker registry repository names must be lowercase, and
        # github.repository preserves the owner's casing. Deriving it here keeps
        # the tags correct if the repository is ever renamed, moved or forked.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the Production image
        # Only ever built from a commit that has passed lint, type check, build,
        # the full test suite, the 85% coverage gate, the production stack smoke
        # test and the stack-trace check.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise the deployment
        run: |
          {
            echo "## Production deployment"
            echo
            echo "Image published to \`${{ env.IMAGE }}:prod\` (also tagged \`latest\` and \`${{ github.sha }}\`)."
            echo
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Lint, format, type check, build | passed |"
            echo "| Dependency audit (production) | passed |"
            echo "| Test suite | 0 failures |"
            echo "| Coverage | >= ${{ env.COVERAGE_MIN }}% |"
            echo "| Production Docker stack | healthy, unseeded, smoke tested |"
            echo "| Stack traces in responses | none |"
            echo
            echo "To roll this out onto a hosting platform, add its API token as a"
            echo "secret in the \`production\` environment and enable the release"
            echo "step documented in README.md. No credentials are assumed here."
          } >> "$GITHUB_STEP_SUMMARY"
