name: Game day

# The security chaos game day as code. Every step acts ONLY on this account's own
# resources, with synthetic data, inside an agreed window (security/RULES-OF-ENGAGEMENT.md).
# Stop switch: cancel the run. Nothing injected outlives a step. Each step writes its
# evidence to gameday-out/ (uploaded as an artifact) and mirrors it to the run summary.

on:
  workflow_dispatch:
    inputs:
      step:
        description: Step
        type: choice
        options: [exp1-attack, exp1-contain, exp4-attack, exp4-restore]
        default: exp1-attack
      round:
        description: Round
        type: string
        default: "0"
      t0:
        description: T0 of the attack (exp1-contain only)
        type: string
        default: ""

permissions:
  contents: read

concurrency: gameday

jobs:
  gameday:
    runs-on: ubuntu-latest
    env:
      STEP: ${{ inputs.step }}
      ROUND: ${{ inputs.round }}
      T0_INPUT: ${{ inputs.t0 }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Read the target from the Terraform state
        working-directory: terraform
        run: |
          ACCT=$(aws sts get-caller-identity --query Account --output text)
          terraform init -backend-config="bucket=inventory-api-tfstate-$ACCT" > /dev/null
          # Deterministic names, so round 0 works on the v4.2.0 state too (it predates these outputs).
          {
            echo "BUCKET=inventory-api-exports-$ACCT"
            echo "NODE_ROLE=inventory-api-ec2"
            echo "NODE_ID=$(terraform output -raw node_id)"
          } >> "$GITHUB_ENV"

      # --- Experiment 1: a stolen machine credential used from outside AWS ---------------
      - name: "exp1-attack: read the node credentials and use them from the runner"
        if: inputs.step == 'exp1-attack'
        run: |
          mkdir -p gameday-out
          OUT="gameday-out/exp1-attack-r$ROUND.md"
          T0=$(date -u +%FT%TZ)
          echo "T0=$T0" >> "$GITHUB_ENV"
          {
            echo "### exp1-attack, round $ROUND"
            echo "First adverse act (T0): $T0"
          } > "$OUT"

          # A synthetic victim under flows/, written with the job's own credentials so there is
          # always something to read. In round 1 the stolen credential is denied reaching it.
          VICTIM="flows/gameday-victim/exp1.json"
          echo '{"flow":"synthetic"}' > /tmp/victim.json
          aws s3api put-object --bucket "$BUCKET" --key "$VICTIM" \
            --body /tmp/victim.json --content-type application/json >/dev/null

          # Through SSM, read the role credentials IMDSv2 hands to the node (hop limit 2).
          # As JSON via file://: the shorthand --parameters parser breaks on the script's $() and ;.
          cat > /tmp/ssm.json << 'JSON'
          {"commands":[
            "TOKEN=$(curl -sX PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 120')",
            "R=$(curl -s -H \"X-aws-ec2-metadata-token: $TOKEN\" http://169.254.169.254/latest/meta-data/iam/security-credentials/)",
            "curl -s -H \"X-aws-ec2-metadata-token: $TOKEN\" http://169.254.169.254/latest/meta-data/iam/security-credentials/$R"
          ]}
          JSON
          CMD=$(aws ssm send-command --instance-ids "$NODE_ID" --document-name AWS-RunShellScript \
            --parameters file:///tmp/ssm.json --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD" --instance-id "$NODE_ID" || true
          CREDS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$NODE_ID" \
            --query StandardOutputContent --output text)

          AK=$(echo "$CREDS" | jq -r .AccessKeyId)
          SK=$(echo "$CREDS" | jq -r .SecretAccessKey)
          ST=$(echo "$CREDS" | jq -r .Token)
          echo "::add-mask::$AK"; echo "::add-mask::$SK"; echo "::add-mask::$ST"

          # Use them from here, outside the VPC. Tagged so CloudTrail shows it was the game day.
          export AWS_ACCESS_KEY_ID="$AK" AWS_SECRET_ACCESS_KEY="$SK" AWS_SESSION_TOKEN="$ST"
          export AWS_EXECUTION_ENV="gameday-exp1-r$ROUND"
          # get-object prints JSON on success, so judge by exit status, not by the output.
          if aws s3api get-object --bucket "$BUCKET" --key "$VICTIM" /tmp/stolen.json >/dev/null 2>&1; then OUT1=OK; else OUT1=DENIED; fi
          if aws s3api get-object --bucket "$BUCKET" --key flows/admin-credentials-backup.json /tmp/honey.json >/dev/null 2>&1; then HONEY=OK; else HONEY=DENIED; fi
          {
            echo ""
            echo "| Call (stolen credential, from the runner) | Result |"
            echo "|---|---|"
            echo "| GetObject $VICTIM | $([ "$OUT1" = OK ] && echo 'succeeded — the credential works from outside' || echo 'AccessDenied — the VPC-endpoint policy held') |"
            echo "| GetObject the honeytoken | $([ "$HONEY" = OK ] && echo 'read (decoy)' || echo 'AccessDenied (still alerts)') |"
          } >> "$OUT"
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: "exp1-attack: measure MTTD from /security/alerts"
        if: inputs.step == 'exp1-attack'
        run: |
          mkdir -p gameday-out
          OUT="gameday-out/exp1-mttd-r$ROUND.md"
          # Round 0 has no detection yet: no point polling for ten minutes.
          if ! aws logs describe-log-groups --log-group-name-prefix /security/alerts \
            --query 'logGroups[0].logGroupName' --output text 2>/dev/null | grep -q security; then
            echo "**MTTD: not detected** (no /security/alerts: without CloudTrail + EventBridge, MTTD = ∞)" | tee "$OUT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          START=$(date -u -d "$T0" +%s)
          DETECTED=""
          for _ in $(seq 60); do   # up to 10 min: CloudTrail data events take minutes to reach EventBridge
            # The delivered event is the CloudTrail record (no rule name in it): match the attack's own key.
            # The CLI prints "None" for no match; only a numeric timestamp counts as detection.
            # head -n1: filter-log-events auto-paginates and an empty later page appends "None".
            HIT=$(aws logs filter-log-events --log-group-name /security/alerts \
              --start-time "$(($START * 1000))" \
              --filter-pattern '"gameday-victim"' \
              --query 'events[0].timestamp' --output text 2>/dev/null | head -n1)
            if [[ "$HIT" =~ ^[0-9]+$ ]]; then DETECTED=$HIT; break; fi
            sleep 10
          done
          if [ -n "$DETECTED" ]; then
            MTTD=$(( DETECTED/1000 - START ))
            echo "**MTTD: ${MTTD}s** (first act $T0, alert at $(date -u -d @$((DETECTED/1000)) +%FT%TZ))" | tee "$OUT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**MTTD: not detected within 10 min** (CloudTrail delivery is slow, or round 0 → MTTD = ∞)" | tee "$OUT" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "exp1-contain: revoke the role's sessions, then verify and revert"
        if: inputs.step == 'exp1-contain'
        run: |
          mkdir -p gameday-out
          OUT="gameday-out/exp1-contain-r$ROUND.md"
          T0=${T0_INPUT:-$(date -u +%FT%TZ)}
          CUT=$(date -u +%FT%TZ)
          echo "### exp1-contain, round $ROUND" > "$OUT"

          # The AWS "revoke older sessions" guardrail: deny everything to sessions issued
          # before now. New credentials the node gets after this are unaffected.
          POLICY=$(jq -n --arg t "$CUT" '{Version:"2012-10-17",Statement:[{Effect:"Deny",Action:"*",Resource:"*",Condition:{DateLessThan:{"aws:TokenIssueTime":$t}}}]}')
          aws iam put-role-policy --role-name "$NODE_ROLE" --policy-name AWSRevokeOlderSessions \
            --policy-document "$POLICY"
          CONTAINED=$(date -u +%FT%TZ)
          MTTC=$(( $(date -u -d "$CONTAINED" +%s) - $(date -u -d "$T0" +%s) ))
          {
            echo "First adverse act (T0): $T0"
            echo "Sessions revoked at: $CONTAINED"
            echo "**MTTC: ${MTTC}s**"
          } >> "$OUT"

          # Revert so there is no drift: the node self-heals with a fresh session.
          sleep 15
          aws iam delete-role-policy --role-name "$NODE_ROLE" --policy-name AWSRevokeOlderSessions
          echo "Reverted: inline revoke policy removed; the role is back to its Terraform state." >> "$OUT"
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      # --- Experiment 4: ransomware on the flows/ objects --------------------------------
      - name: "exp4-attack: overwrite and delete the flows objects"
        if: inputs.step == 'exp4-attack'
        run: |
          mkdir -p gameday-out
          OUT="gameday-out/exp4-attack-r$ROUND.md"
          T0=$(date -u +%FT%TZ)
          {
            echo "### exp4-attack, round $ROUND"
            echo "First adverse act (T0): $T0"
          } > "$OUT"

          # A synthetic victim object, written now so there is a known-good version.
          KEY="flows/gameday-r$ROUND/$(date -u +%s).json"
          echo '{"flow":"synthetic good data"}' > /tmp/good.json
          aws s3api put-object --bucket "$BUCKET" --key "$KEY" \
            --body /tmp/good.json --content-type application/json >/dev/null
          GOOD=$(date -u +%FT%TZ)

          # Ransomware: overwrite with garbage, then try to delete. Judge by exit status.
          echo 'ENCRYPTED-BY-RANSOMWARE' > /tmp/bad.json
          if aws s3api put-object --bucket "$BUCKET" --key "$KEY" --body /tmp/bad.json >/dev/null 2>&1; then OVER=OK; else OVER=FAIL; fi
          if aws s3api delete-object --bucket "$BUCKET" --key "$KEY" >/dev/null 2>&1; then DEL=OK; else DEL=FAIL; fi
          NVER=$(aws s3api list-object-versions --bucket "$BUCKET" --prefix "$KEY" \
            --query 'length(Versions || `[]`)' --output text 2>/dev/null || echo 0)
          {
            echo ""
            echo "| Act | Result |"
            echo "|---|---|"
            echo "| last good write | $GOOD |"
            echo "| overwrite | $OVER |"
            echo "| delete | $DEL |"
            echo "| versions kept | $NVER (round 0 without versioning: 1, nothing to recover; round 1: ≥2) |"
          } >> "$OUT"
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: "exp4-restore: bring back the last good version and measure RTO"
        if: inputs.step == 'exp4-restore'
        run: |
          mkdir -p gameday-out
          OUT="gameday-out/exp4-restore-r$ROUND.md"
          START=$(date -u +%s)
          echo "### exp4-restore, round $ROUND" > "$OUT"

          # From list-object-versions, not list-objects-v2: after the delete the current version is a
          # delete marker, so the object no longer appears as a live object, only among its versions.
          KEY=$(aws s3api list-object-versions --bucket "$BUCKET" --prefix "flows/gameday-r$ROUND/" \
            --query 'Versions[-1].Key' --output text | head -n1)
          VERS=$(aws s3api list-object-versions --bucket "$BUCKET" --prefix "$KEY" \
            --query 'Versions | sort_by(@, &LastModified)' --output json)
          N=$(echo "$VERS" | jq length)
          if [ "$N" -lt 2 ]; then
            echo "Only $N version(s): nothing to restore (round 0). **RPO / RTO = ∞**." | tee -a "$OUT" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The good version is the one before the ransomware overwrite.
          GOOD_VID=$(echo "$VERS" | jq -r '.[-2].VersionId')
          GOOD_TS=$(echo "$VERS" | jq -r '.[-2].LastModified')
          BAD_TS=$(echo "$VERS" | jq -r '.[-1].LastModified')
          aws s3api copy-object --bucket "$BUCKET" --key "$KEY" \
            --copy-source "$BUCKET/$KEY?versionId=$GOOD_VID" >/dev/null
          RTO=$(( $(date -u +%s) - START ))
          RPO=$(( $(date -u -d "$BAD_TS" +%s) - $(date -u -d "$GOOD_TS" +%s) ))
          {
            echo "Restored version $GOOD_VID (written $GOOD_TS)."
            echo "**RTO: ${RTO}s** · **RPO: ${RPO}s** (good write → ransomware overwrite)"
          } >> "$OUT"
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gameday-${{ inputs.step }}-r${{ inputs.round }}
          path: gameday-out/
