name: Detections

# The detection-as-code gate: each EventBridge pattern must fire on its positive event and
# not on its negative one. Runs on every change to the rules, and on demand.
on:
  workflow_dispatch:
  push:
    paths:
      - security/detections/**
      - .github/workflows/detections.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Positive fires, negative does not
        run: bash security/test-detections.sh
