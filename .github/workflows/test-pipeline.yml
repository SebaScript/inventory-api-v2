# ---------------------------------------------------------------------------
# Test Pipeline — the gate that guards the `develop` branch.
#
#   Checkout -> Install -> Lint -> Type check -> Build
#            -> Start test infrastructure -> Run tests -> Coverage >= 60%
#            -> Docker stack smoke test -> Deploy Test
#
# Every stage is a job chained with `needs`, so a failure anywhere structurally
# prevents everything downstream from running — the deployment cannot happen
# after a red test. There is no `|| true`, no `continue-on-error`, and no step
# that swallows an exit code anywhere in this file.
# ---------------------------------------------------------------------------
name: Test Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: test-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # The Test environment's quality bar.
  COVERAGE_MIN: '60'

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  quality:
    name: Lint, type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # `npm ci` fails if package-lock.json is out of step with package.json,
        # which is itself a check worth having.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify build output
        # A build that "succeeds" without producing an entry point would
        # otherwise only be discovered at deploy time.
        run: test -f dist/main.js && test -f dist/database/data-source.js

  # -------------------------------------------------------------------------
  test:
    name: Tests and coverage gate (>= 60%)
    needs: quality
    runs-on: ubuntu-latest

    services:
      # Real PostgreSQL, not a stand-in. The suite asserts on transactions, row
      # locks and CHECK constraints, none of which can be faked.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inventory_ci
          POSTGRES_PASSWORD: inventory_ci
          POSTGRES_DB: inventory_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inventory_ci -d inventory_ci -q"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Present, so the suite uses this server instead of booting an embedded one.
      DATABASE_URL: postgres://inventory_ci:inventory_ci@localhost:5432/inventory_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit, integration and E2E tests with coverage
        # Jest exits non-zero when the threshold is missed, so this single step
        # is both the test run and the coverage gate. COVERAGE_MIN is what makes
        # the same command enforce 60% here and 85% in the production pipeline.
        run: npm run test:ci
        env:
          COVERAGE_MIN: ${{ env.COVERAGE_MIN }}

      - name: Report coverage
        if: always()
        run: |
          node -e "
            const s = require('./coverage/coverage-summary.json').total;
            const min = Number(process.env.COVERAGE_MIN);
            const rows = ['| Metric | Covered | Threshold | Status |', '|---|---|---|---|'];
            for (const key of ['lines', 'statements', 'functions', 'branches']) {
              const pct = s[key].pct;
              rows.push('| ' + key + ' | ' + pct + '% | ' + min + '% | ' + (pct >= min ? 'PASS' : 'FAIL') + ' |');
            }
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Coverage (Test)\n\n' + rows.join('\n') + '\n');
          "
        env:
          COVERAGE_MIN: ${{ env.COVERAGE_MIN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test
          path: coverage/
          retention-days: 14

  # -------------------------------------------------------------------------
  docker:
    name: Docker stack smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the Test environment file
        # The stack's real credentials live in GitHub Secrets; the fallback lets
        # the pipeline run on a fork that has none configured. Either way this
        # never touches a real database.
        run: |
          cat > .env.test <<EOF
          NODE_ENV=test
          PORT=3000
          POSTGRES_USER=inventory_test
          POSTGRES_PASSWORD=${{ secrets.TEST_DB_PASSWORD || 'ci_ephemeral_password' }}
          POSTGRES_DB=inventory_test
          POSTGRES_PORT=5433
          API_PORT=3100
          DB_SSL=false
          DB_LOGGING=false
          DB_POOL_SIZE=10
          RUN_MIGRATIONS_ON_START=true
          SEED_ON_START=true
          SWAGGER_ENABLED=true
          CORS_ORIGIN=*
          LOG_LEVEL=log
          EOF

      - name: Build and start the Test stack
        # Exercises the exact files that ship: same Dockerfile, same compose
        # file, same entrypoint.
        run: npm run docker:test -- --detach --wait --wait-timeout 180

      - name: Smoke test the running API
        run: bash scripts/smoke-test.sh http://localhost:3100

      - name: Dump container logs on failure
        if: failure()
        run: docker compose --env-file .env.test -f docker-compose.test.yml logs --no-color

      - name: Tear down
        if: always()
        run: npm run docker:test:down

  # -------------------------------------------------------------------------
  deploy-test:
    name: Deploy Test
    needs: docker
    runs-on: ubuntu-latest
    # Only real pushes to develop deploy; a pull request runs every gate above
    # but stops here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the Test image
        # The deployable artefact. It is only ever built from a commit that has
        # already passed lint, type check, build, tests, the coverage gate and
        # the Docker smoke test.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:test
            ghcr.io/${{ github.repository }}:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise the deployment
        run: |
          {
            echo "## Test deployment"
            echo
            echo "Image published to \`ghcr.io/${{ github.repository }}:test\`"
            echo
            echo "Run it with:"
            echo '```bash'
            echo "docker run -p 3100:3000 -e DATABASE_URL=... ghcr.io/${{ github.repository }}:test"
            echo '```'
            echo
            echo "To deploy onto a hosting platform instead, add its API token as a"
            echo "secret in the \`test\` environment and enable the release step"
            echo "documented in README.md. No credentials are assumed here."
          } >> "$GITHUB_STEP_SUMMARY"
