# Test pipeline — guards the `develop` branch.
#
#   install -> lint -> build -> tests -> coverage >= 60% -> deploy Test
#
# Each step runs in order and the job stops at the first failure, so a red test
# or a missed coverage bar makes the deploy step unreachable.
name: Test Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    # Publishing the image to GHCR needs write access to packages, which the
    # default GITHUB_TOKEN does not have. Everything else stays read-only.
    permissions:
      contents: read
      packages: write

    services:
      # Real PostgreSQL: the tests assert on transactions, row locks and CHECK
      # constraints, none of which can be faked.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10

    env:
      DATABASE_URL: postgres://inventory:inventory@localhost:5432/inventory_test
      # The Test environment's quality bar.
      COVERAGE_MIN: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Jest exits non-zero on a failing test AND on missed coverage, so this
      # single step is both the test run and the quality gate.
      - name: Test and coverage gate (>= 60%)
        run: npm run test:cov

      - name: Build the Docker image
        run: docker build -t inventory-api:test .

      # A pull request is a check, not a release: it runs every step above
      # but publishes nothing.
      - name: Deploy to Test
        if: github.event_name == 'push'
        run: |
          echo "Publishing image for the Test environment"
          docker tag inventory-api:test ghcr.io/${GITHUB_REPOSITORY,,}:test
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:test
