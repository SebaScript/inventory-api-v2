name: Test Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10

    env:
      DATABASE_URL: postgres://inventory:inventory@localhost:5432/inventory_test
      COVERAGE_MIN: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Quality gate 1 - the rubric allows zero failing tests. Jest exits
      # non-zero if a single test fails, and also if it finds no tests at all,
      # so the gate cannot be passed by deleting the suite.
      - name: Quality gate 1 - automated tests (0 failures allowed)
        run: npm test

      # Quality gate 2 - the coverage bar for this environment. COVERAGE_MIN
      # feeds Jest's coverageThreshold, and missing it exits non-zero as well.
      - name: Quality gate 2 - coverage (>= 60%)
        run: npm run test:cov

      - name: Build the Docker image
        run: docker build -t inventory-api:test .

      - name: Deploy to Test
        if: github.event_name == 'push'
        run: |
          echo "Publishing image for the Test environment"
          docker tag inventory-api:test ghcr.io/${GITHUB_REPOSITORY,,}:test
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:test
