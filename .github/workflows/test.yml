name: Test Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  # Build and verify. Produces the artifact; deploys nothing.
  pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10

    env:
      DATABASE_URL: postgres://inventory:inventory@localhost:5432/inventory_test
      COVERAGE_MIN: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Quality gate 1 - automated tests (0 failures)
        run: npm test

      - name: Quality gate 2 - coverage >= 60%
        run: npm run test:cov

      - name: Build the Docker image
        run: docker build -t inventory-api:test .

      - name: Publish the image to GHCR
        run: |
          docker tag inventory-api:test ghcr.io/${GITHUB_REPOSITORY,,}:test
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:test

  # The deployment itself: this is what updates the API that is running.
  #
  # It runs on a self-hosted runner because that machine is the Test host.
  # GitHub cannot reach into it, so the runner reaches out, pulls the image the
  # job above published, and restarts the stack with it. Nothing is ever built
  # here — the server runs the exact artifact that passed the gates.
  #
  # `needs: pipeline` is what makes the gates binding: if either gate fails,
  # the job above fails and this one never starts. A pull request builds and
  # publishes, but does not deploy.
  deploy:
    needs: pipeline
    if: github.event_name == 'push'
    runs-on: self-hosted

    # The environment holds its own secrets, and GitHub records a deployment
    # against it on every run.
    environment:
      name: test
      url: http://localhost:3100

    # PowerShell, not bash: on a Windows runner `bash` resolves to the WSL stub
    # in WindowsApps, while Git Bash sits outside PATH. PowerShell is always
    # present and needs no machine-specific setup.
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Write the environment configuration
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ENV_FILE)) {
            Write-Output "::error::The test environment has no ENV_FILE secret configured."
            exit 1
          }
          # LF endings and no byte-order mark, or Compose reads stray characters
          # into the values.
          $text = $env:ENV_FILE -replace "`r`n", "`n"
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("$PWD\.env.test", $text, $utf8)

      - name: Pull the published image and restart the stack
        run: |
          docker compose --env-file .env.test pull api
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker compose --env-file .env.test up -d --no-build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify the environment is serving the new image
        run: |
          $healthy = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-RestMethod http://localhost:3100/health -TimeoutSec 5
              if ($r.status -eq 'ok') { $healthy = $true; break }
            } catch { }
            Start-Sleep -Seconds 2
          }
          if (-not $healthy) {
            Write-Output "::error::The Test API never became healthy after the restart."
            exit 1
          }
          Write-Output "health: ok"

          # The running container must be the image that was just pulled, not a
          # leftover from an earlier deployment.
          $expected = (docker image inspect --format '{{.Id}}' ghcr.io/sebascript/inventory-api-v2:test | Select-Object -First 1)
          $cid = (docker compose --env-file .env.test ps -q api | Select-Object -First 1)
          $running = (docker inspect --format '{{.Image}}' $cid | Select-Object -First 1)
          Write-Output "expected: $expected"
          Write-Output "running:  $running"
          if ($expected -ne $running) {
            Write-Output "::error::The running container is not the image that was just published."
            exit 1
          }

      - name: Remove the environment file from the workspace
        if: always()
        run: |
          if (Test-Path .env.test) { Remove-Item .env.test -Force }
