name: Test Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  # Build and verify. Produces the artifact; deploys nothing.
  pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10

    env:
      DATABASE_URL: postgres://inventory:inventory@localhost:5432/inventory_test
      COVERAGE_MIN: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Quality gate 1 - automated tests (0 failures)
        run: npm test

      - name: Quality gate 2 - coverage >= 60%
        run: npm run test:cov

      - name: Build the Docker image
        run: docker build --build-arg GIT_SHA=${GITHUB_SHA} -t inventory-api:test .

      # Two tags for one image: `test` is what a human pulls, the commit sha is
      # the immutable reference the deployment pins itself to.
      - name: Publish the image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag inventory-api:test ghcr.io/${GITHUB_REPOSITORY,,}:test
          docker tag inventory-api:test ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:test
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}

  # The deployment itself: this is what updates the API that is running.
  #
  # Railway hosts the environment, so deploying is one command: tell Railway to
  # pull the image this pipeline just published and roll it out. Nothing is
  # built here — the environment runs the exact artifact that passed the gates.
  #
  # `needs: pipeline` is what makes the quality gates binding: if either gate
  # fails, the job above fails and this one never starts. A pull request builds
  # and publishes, but does not deploy.
  deploy:
    needs: pipeline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    environment:
      name: test
      url: ${{ vars.RAILWAY_SERVICE_URL }}

    steps:
      - name: Deploy the published image to Railway
        env:
          # A Railway project token is scoped to one environment, so it selects
          # the target on its own: there is no environment flag to get wrong.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g @railway/cli

          # --from-source is what makes this a deployment rather than a restart:
          # without it Railway would redeploy the image it is already running.
          railway redeploy --service "${{ vars.RAILWAY_SERVICE }}" --yes --from-source

      # Proof rather than assumption: every image is stamped with the commit it
      # was built from, so the running service is asked what it is serving.
      - name: Verify the live service is serving this revision
        env:
          SERVICE_URL: ${{ vars.RAILWAY_SERVICE_URL }}
        run: |
          set -euo pipefail
          # Accept the domain with or without a scheme, and with or without a
          # trailing slash: the dashboard shows it bare, which is how it tends
          # to get copied.
          url="${SERVICE_URL%/}"
          case "$url" in http://* | https://*) ;; *) url="https://$url" ;; esac
          echo "checking $url/health"

          for _ in $(seq 1 40); do
            body=$(curl -fsSL --max-time 20 "${url}/health" || true)
            revision=$(echo "$body" | jq -r '.revision // empty')

            if [ "$revision" = "${GITHUB_SHA}" ]; then
              echo "health: $body"
              exit 0
            fi
            echo "serving revision ${revision:-none}, waiting for ${GITHUB_SHA}"
            sleep 10
          done
          echo "::error::The service never reported revision ${GITHUB_SHA}."
          exit 1
