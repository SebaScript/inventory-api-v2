services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-inventory}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventory}
      POSTGRES_DB: ${DB_NAME:-inventory}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-inventory} -d ${DB_NAME:-inventory}']
      interval: 5s
      retries: 10

  api:
    # Local development builds from source. The Test and Production env files
    # set API_IMAGE to the tag the pipeline published, so those environments
    # run exactly the artifact that cleared the quality gates.
    image: ${API_IMAGE:-inventory-api:dev}
    build: .
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://${DB_USER:-inventory}:${DB_PASSWORD:-inventory}@postgres:5432/${DB_NAME:-inventory}
      SEED: ${SEED:-true}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
